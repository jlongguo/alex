name: Verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # 保留既有 test check 名称，避免改变可能存在的分支保护要求。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      # Chromium 由 GitHub 托管运行器提供；缺失或 CDP 不可用必须失败。
      - run: npm run test:browser

  sim-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run sim:check
      - run: npm run sim:preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ros-preflight-not-runtime-acceptance
          if-no-files-found: warn
          include-hidden-files: true
          path: .local/ros/preflight.json

  evidence-summary:
    name: evidence-summary
    if: ${{ always() }}
    needs: [test, browser, sim-static]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify immutable workflow provenance
        run: npm run release:workflow-provenance -- verify
      - name: Write and verify current CI evidence
        env:
          ALEX_CI_TEST_RESULT: ${{ needs.test.result }}
          ALEX_CI_BROWSER_RESULT: ${{ needs.browser.result }}
          ALEX_CI_SIM_STATIC_RESULT: ${{ needs['sim-static'].result }}
        run: |
          set -euo pipefail
          node scripts/ci-evidence.mjs write .local/ci/evidence.json
          node scripts/ci-evidence.mjs verify .local/ci/evidence.json
      - name: Upload CI evidence summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alex-ci-evidence
          if-no-files-found: error
          include-hidden-files: true
          path: .local/ci/evidence.json
