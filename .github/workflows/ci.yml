name: Verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      # Chromium 由 GitHub 托管运行器提供；缺失时必须失败，而非假装跳过验收。
      - run: npm run test:browser
      - run: npm run sim:check
      - run: npm run sim:preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros-preflight-not-runtime-acceptance
          path: .local/ros/preflight.json
