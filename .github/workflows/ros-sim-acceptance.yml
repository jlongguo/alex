# Explicitly launched on a dedicated simulation-only machine. NOT general CI.
name: ROS Gazebo Nav2 Acceptance (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  nav2-simulation:
    if: ${{ vars.ALEX_SIM_RUNNER_APPROVED == 'true' }}
    runs-on: [self-hosted, linux, x64, alex-ros-sim]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # 自托管工作区可能保留上次 PASS：在任何新执行开始之前先让 Bundle 失效。
      - name: Invalidate previous ROS workflow evidence
        run: python3 scripts/ros-workflow-evidence-bundle.py --reset
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and offline ROS assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run sim:check
      - name: Run isolated Gazebo + Nav2 navigation acceptance
        shell: bash
        env:
          ALEX_ROS_SIMULATION_ONLY: '1'
          ALEX_RUN_ROS_INTEGRATION: '1'
          ALEX_GZ_HEADLESS_RENDERING: '1'
          ROS_DOMAIN_ID: '77'
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          npm run sim:accept
      - name: Run real Nav2 cancel + stop acceptance in a fresh isolated Gazebo session
        shell: bash
        env:
          ALEX_ROS_SIMULATION_ONLY: '1'
          ALEX_RUN_ROS_INTEGRATION: '1'
          ALEX_GZ_HEADLESS_RENDERING: '1'
          ROS_DOMAIN_ID: '77'
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          npm run sim:accept-cancel
      - name: Run same-session Nav2 cancel-recover-dock acceptance
        shell: bash
        env:
          ALEX_ROS_SIMULATION_ONLY: '1'
          ALEX_RUN_ROS_INTEGRATION: '1'
          ALEX_GZ_HEADLESS_RENDERING: '1'
          ROS_DOMAIN_ID: '77'
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          npm run sim:accept-recovery
      - name: Run live Node to Python to Nav2 bridge acceptance in a fresh isolated Gazebo session
        shell: bash
        env:
          ALEX_ROS_SIMULATION_ONLY: '1'
          ALEX_RUN_ROS_INTEGRATION: '1'
          ALEX_GZ_HEADLESS_RENDERING: '1'
          ROS_DOMAIN_ID: '77'
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          npm run sim:accept-bridge
      - name: Bind four scenarios to this Actions run and verify evidence checksums
        run: |
          set -euo pipefail
          npm run sim:bundle-collect
          npm run sim:bundle-verify -- --expect-run-id "$GITHUB_RUN_ID" --expect-sha "$GITHUB_SHA" --expect-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload acceptance report and launch logs even on failure
        id: ros_evidence_upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alex-ros-gazebo-acceptance
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .local/ros/acceptance-report.json
            .local/ros/acceptance-launch.log
            .local/ros/preflight.json
            .local/ros/diagnostics.json
            .local/ros/cancel-acceptance-report.json
            .local/ros/cancel-acceptance-launch.log
            .local/ros/cancel-preflight.json
            .local/ros/cancel-diagnostics.json
            .local/ros/recovery-acceptance-report.json
            .local/ros/recovery-acceptance-launch.log
            .local/ros/recovery-preflight.json
            .local/ros/recovery-diagnostics.json
            .local/ros/bridge-acceptance-report.json
            .local/ros/bridge-acceptance-launch.log
            .local/ros/bridge-preflight.json
            .local/ros/bridge-diagnostics.json
            .local/ros/workflow-evidence-bundle.json
      - name: Read back current Run and ROS Artifact from GitHub Actions API
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALEX_ROS_ARTIFACT_ID: ${{ steps.ros_evidence_upload.outputs.artifact-id }}
          ALEX_ROS_ARTIFACT_DIGEST: ${{ steps.ros_evidence_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python3 scripts/github-actions-ros-readback.py --audit
          python3 scripts/github-actions-ros-readback.py --verify \
            --report .local/ros/github-actions-readback.json \
            --artifact-id "$ALEX_ROS_ARTIFACT_ID" \
            --artifact-digest "$ALEX_ROS_ARTIFACT_DIGEST" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --commit-sha "$GITHUB_SHA"
      - name: Bind immutable artifact ID and digest to this successful ROS run
        if: success()
        env:
          ALEX_ROS_ARTIFACT_ID: ${{ steps.ros_evidence_upload.outputs.artifact-id }}
          ALEX_ROS_ARTIFACT_DIGEST: ${{ steps.ros_evidence_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python3 scripts/write-ros-artifact-attestation.py
          python3 scripts/verify-ros-artifact-attestation.py \
            --attestation .local/ros/artifact-attestation.json \
            --folder .local/ros \
            --artifact-id "$ALEX_ROS_ARTIFACT_ID" \
            --artifact-digest "$ALEX_ROS_ARTIFACT_DIGEST" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --commit-sha "$GITHUB_SHA"
          python3 scripts/verify-ros-evidence-set.py \
            --folder .local/ros \
            --attestation .local/ros/artifact-attestation.json \
            --github-readback .local/ros/github-actions-readback.json \
            --artifact-id "$ALEX_ROS_ARTIFACT_ID" \
            --artifact-digest "$ALEX_ROS_ARTIFACT_DIGEST" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --commit-sha "$GITHUB_SHA"
      - name: Upload ROS artifact attestation separately
        id: ros_attestation_upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alex-ros-gazebo-attestation
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .local/ros/artifact-attestation.json
            .local/ros/github-actions-readback.json
