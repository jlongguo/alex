# Applied to the ROS 2 Jazzy nav2_bringup default params via RewrittenYaml.
# In meters / radians. These are simulation tuning starting points, not validated tolerances.
use_sim_time: true
base_frame_id: base_link
robot_radius: 0.19
inflation_radius: 0.24
xy_goal_tolerance: 0.04
yaw_goal_tolerance: 0.20
required_movement_radius: 0.08
vx_max: 0.20
vx_min: -0.10
wz_max: 1.00
max_vel_x: 0.20
max_vel_theta: 1.00
